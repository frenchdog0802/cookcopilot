# Local full stack: frontend (nginx) + Nest API + Postgres
# Usage:
#   cp backend-node/.env.example backend-node/.env   # fill secrets
#   docker compose up --build
#
# Railway/Render: deploy `backend-node/` and `frontend/` as separate services from their Dockerfiles.
# Set backend env vars on the host; for frontend set build arg VITE_API_BASE_URL to the API public URL.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lardermind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lardermind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lardermind"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-node
    ports:
      - "8090:8090"
    env_file:
      - ./backend-node/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lardermind
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSL_MODE: disable
      PORT: 8090
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Empty → browser calls /api on same origin; nginx.compose.conf proxies to backend
        VITE_API_BASE_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:80"
    volumes:
      - ./frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  lardermind_pg:
