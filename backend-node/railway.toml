# Railway / Render: deploy THIS folder only (Root Directory = backend-node/)
#
# Required env: DB_*, JWT_SECRET, FRONTEND_URL, CORS_ALLOWED_ORIGINS
# Optional Wave 2: DEEPSEEK_API_KEY, CLOUDINARY_*, STRIPE_*, STRIPE_PRICE_*
# PORT is provided by the platform automatically.
# Recommend memory: ≥512MB (768MB–1GB safer for AI chat).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
